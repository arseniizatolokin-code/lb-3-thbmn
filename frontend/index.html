<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фріланс-біржа з ескроу</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Фріланс-біржа з ескроу <small>оцінка ризику спору</small></h1>
  <div id="wallet">
    <button id="btn-metamask">Підключити MetaMask</button>
    <span class="or">або</span>
    <select id="local-accounts"><option value="">Локальний вузол: обрати акаунт…</option></select>
    <span id="net" class="badge">мережа: —</span>
    <span id="acct" class="badge">акаунт: —</span>
    <span id="roles" class="badge">ролі: —</span>
  </div>
</header>
<nav id="tabs">
  <button data-tab="deals" class="active">Угоди</button>
  <button data-tab="decision">Рішення моделі</button>
  <button data-tab="audit">Аудит</button>
  <button data-tab="admin">Арбітр / адміністратор</button>
</nav>
<div id="error" class="error" hidden></div>
<main>
  <section id="tab-deals">
    <details id="new-deal" open><summary>Нова угода (замовник)</summary>
      <div class="grid">
        <label>Адреса виконавця <input id="f-freelancer" placeholder="0x…"></label>
        <label>Категорія <select id="f-category"></select></label>
        <label class="wide">Технічне завдання (зберігається поза ланцюгом, у ланцюг іде хеш)
          <textarea id="f-spec" rows="3"></textarea></label>
      </div>
      <div id="ms-rows"></div>
      <button id="ms-add" class="ghost">+ етап</button>
      <button id="btn-create" class="primary">Створити угоду</button>
    </details>
    <h2>Мої угоди <button id="btn-refresh" class="ghost">Оновити</button></h2>
    <div id="deals"></div>
  </section>
  <section id="tab-decision" hidden>
    <h2>Рішення моделі <select id="dec-deal"></select></h2>
    <div id="decision"></div>
  </section>
  <section id="tab-audit" hidden>
    <h2>Аудит: історія рішень з ланцюга <button id="btn-verify-all" class="ghost">Перевірити цілісність усіх</button></h2>
    <div id="models"></div>
    <table id="audit-table"><thead><tr><th>Угода</th><th>Ризик</th><th>Версія моделі</th><th>Хеш входу</th><th>Блок</th><th>Транзакція</th><th>Цілісність</th></tr></thead><tbody></tbody></table>
  </section>
  <section id="tab-admin" hidden>
    <h2>Арбітр</h2><div id="disputes"></div>
    <h2>Адміністратор</h2>
    <div id="admin-box">
      <p>Оракул: <code id="adm-oracle">—</code></p>
      <button id="btn-pause-escrow">Призупинити Escrow</button>
      <button id="btn-unpause-escrow">Відновити Escrow</button>
      <button id="btn-pause-oracle">Призупинити оракула</button>
      <button id="btn-unpause-oracle">Відновити оракула</button>
      <div class="grid"><label class="wide">Нова версія моделі (SHA-256, 0x…)<input id="adm-model"></label></div>
      <button id="btn-register-model">Зареєструвати версію моделі</button>
    </div>
  </section>
</main>
<aside id="txlog"><h3>Статус транзакцій</h3><ul id="txlist"></ul></aside>
<script src="/static/ethers.umd.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
